<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de notas | SmartNotes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <style>
        body {
            background: #f7f8fd;
            color: #122438;
        }

        .panel {
            background: white;
            border: 1px solid #e6e9f0;
            border-radius: 12px;
            padding: 28px;
        }

        .vista-previa {
            min-height: 260px;
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <header th:replace="~{general/fragmentos :: header}"></header>

    <main class="container py-5">
        <p class="fw-bold text-primary">
            SmartNotes · Generador de notas
        </p>

        <div class="d-flex flex-wrap justify-content-between
                 align-items-center gap-3 mb-2">
            <h1 class="fw-bold mb-0">Generador de notas</h1>

            <nav class="d-flex gap-3">
                <a th:href="@{/Generador_Notas/generador}" class="text-decoration-none fw-semibold">
                    Generador
                </a>
                <a th:href="@{/Generador_Notas/notas}" class="text-decoration-none fw-semibold">
                    Notas guardadas
                </a>
            </nav>
        </div>

        <p class="text-secondary">
            Completa los datos para generar una nota a partir de una plantilla.
        </p>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${preview}" class="alert alert-success" role="alert">
            Vista previa generada correctamente.
        </div>

        <form class="panel" th:action="@{/Generador_Notas/generador/preview}" method="post" th:object="${form}">

            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="mb-3">
                        <label for="idPlantilla" class="form-label">
                            Plantilla
                        </label>

                        <select id="idPlantilla" class="form-select" th:field="*{plantillaId}">
                            <option value="">Selecciona una plantilla</option>
                            <option th:each="plantilla : ${plantillas}" th:value="${plantilla.idPlantilla}"
                                th:text="${plantilla.nombre}">
                                Plantilla
                            </option>
                        </select>

                        <div th:if="${#fields.hasErrors('plantillaId')}" th:errors="*{plantillaId}"
                            class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label for="teamMemberId" class="form-label">
                            Miembro del equipo
                        </label>

                        <select id="teamMemberId" class="form-select" th:field="*{teamMemberId}">
                            <option value="">Selecciona un miembro</option>
                            <option th:each="miembro : ${miembros}" th:value="${miembro.idTeamMember}"
                                th:text="${miembro.nombre + ' - ' + miembro.puesto}">
                                Miembro
                            </option>
                        </select>

                        <div th:if="${#fields.hasErrors('teamMemberId')}" th:errors="*{teamMemberId}"
                            class="text-danger small mt-1"></div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="fechaInicio" class="form-label">
                                Fecha de inicio
                            </label>
                            <input id="fechaInicio" type="date" class="form-control" th:field="*{fechaInicio}">
                            <div th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"
                                class="text-danger small mt-1"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="fechaFin" class="form-label">
                                Fecha final
                            </label>
                            <input id="fechaFin" type="date" class="form-control" th:field="*{fechaFin}">
                            <div th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"
                                class="text-danger small mt-1"></div>
                        </div>
                    </div>

                    <div class="mt-3 mb-3">
                        <label for="descripcion" class="form-label">
                            Descripción
                        </label>
                        <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                        <div th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"
                            class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label for="correccion" class="form-label">
                            Corrección
                        </label>
                        <textarea id="correccion" class="form-control" th:field="*{correccion}" rows="3"></textarea>
                        <div th:if="${#fields.hasErrors('correccion')}" th:errors="*{correccion}"
                            class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label for="evidencia" class="form-label">
                            Evidencias
                        </label>
                        <textarea id="evidencia" class="form-control" th:field="*{evidencia}" rows="3"
                            placeholder="Una evidencia por línea o separada por comas"></textarea>
                    </div>

                    <div class="form-check mb-3">
                        <input id="guardarComoBorrador" type="checkbox" class="form-check-input"
                            th:field="*{guardarComoBorrador}">
                        <label for="guardarComoBorrador" class="form-check-label">
                            Guardar como borrador
                        </label>
                    </div>

                    <div class="d-flex flex-wrap justify-content-end gap-3">
                        <button type="submit" class="btn btn-outline-primary">
                            Vista previa
                        </button>
                        <button type="submit" formaction="/Generador_Notas/generador/guardar" class="btn btn-primary">
                            Guardar nota
                        </button>
                    </div>
                </div>

                <div class="col-lg-5">
                    <h2 class="h5 mb-3">Vista previa</h2>
                    <div class="alert alert-light border vista-previa"
                        th:text="${preview != null ? preview : 'La vista previa aparecerá aquí al completar los datos.'}">
                        La vista previa aparecerá aquí al completar los datos.
                    </div>
                </div>
            </div>
        </form>
    </main>
</body>

</html>
