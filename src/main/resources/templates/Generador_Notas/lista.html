<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Notas guardadas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 0; }
        .container { max-width: 1100px; margin: 32px auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eaedf5; text-align: left; }
        th { background: #f5f8ff; }
        .actions a, .actions button { margin-right: 8px; text-decoration: none; color: #1f6feb; font-weight: 600; background: none; border: none; cursor: pointer; }
        .danger { color: #b42318; }
        .nav { display: flex; gap: 12px; margin-bottom: 20px; }
        .nav a { text-decoration: none; color: #1f6feb; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/Generador_Notas/generador}">Generador</a>
    </div>

    <h2>Notas guardadas</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Plantilla</th>
                <th>Responsable</th>
                <th>Estado</th>
                <th>Fechas</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="nota : ${notas}">
                <td th:text="${nota.idNota}"></td>
                <td th:text="${nota.plantilla.nombre}"></td>
                <td th:text="${nota.teamMember.nombre}"></td>
                <td th:text="${nota.estado}"></td>
                <td th:text="${#temporals.format(nota.fechaError, 'dd/MM/yyyy') + ' - ' + #temporals.format(nota.fechaEmision, 'dd/MM/yyyy')}"></td>
                <td class="actions">
                    <a th:href="@{/Generador_Notas/notas/{id}(id=${nota.idNota})}">Ver</a>
                    <a th:href="@{/Generador_Notas/notas/{id}/editar(id=${nota.idNota})}">Editar</a>
                    <form th:action="@{/Generador_Notas/notas/{id}/eliminar(id=${nota.idNota})}" method="post" style="display:inline;">
                        <button type="submit" class="danger">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
