<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<!-- Configuración y estilos compartidos -->
<head th:fragment="head">
    <title>SmartNotes</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/webjars/font-awesome/css/all.css}">

    <link rel="stylesheet"
          th:href="@{/css/smartnotes.css}">

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}">
    </script>
</head>

<body>

<!-- Menú compartido -->
<header th:fragment="header" class="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a th:href="@{/}" class="navbar-brand">
                <i class="fa-solid fa-pen-to-square"></i>
                <span th:text="#{aplicacion.titulo}">
                    SmartNotes
                </span>
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarCollapse"
                    aria-controls="navbarCollapse"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                 id="navbarCollapse">

                <!-- Navegación -->
                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/plantillas}">
                            Catálogo de plantillas
                        </a>
                    </li>

                    <li class="nav-item"
                        sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link"
                           th:href="@{/plantillas/administracion}">
                            Administrar plantillas
                        </a>
                    </li>

                </ul>

                <!-- Idioma, usuario y cierre de sesión -->
                <ul class="navbar-nav align-items-lg-center">

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           id="menuIdioma"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false"
                           th:text="#{plantilla.idioma}">
                            Idioma
                        </a>

                        <ul class="dropdown-menu"
                            aria-labelledby="menuIdioma">

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/(lang=es)}">
                                    Español
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/(lang=en)}">
                                    English
                                </a>
                            </li>

                        </ul>
                    </li>

                    <li class="nav-item px-lg-2 text-white">
                        <i class="fa-solid fa-user"></i>

                        <span sec:authentication="name">
                            Usuario
                        </span>
                    </li>

                    <li class="nav-item mt-2 mt-lg-0">
                        <form th:action="@{/logout}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-outline-light btn-sm">

                                <i class="fa-solid fa-right-from-bracket"></i>

                                <span th:text="#{accion.cerrar_sesion}">
                                    Cerrar sesión
                                </span>
                            </button>

                        </form>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
</header>

<!-- Pie de página compartido -->
<footer th:fragment="footer"
        class="p-2 mt-5 bg-light text-muted d-print-none">

    <p class="text-center mb-0">
        <span th:text="#{plantilla.derechos}">
            SmartNotes Derechos Reservados
        </span>
        &copy;
    </p>

</footer>

</body>
</html>
