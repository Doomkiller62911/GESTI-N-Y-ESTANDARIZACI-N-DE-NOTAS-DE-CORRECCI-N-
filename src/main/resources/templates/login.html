<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="card login-card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="logo-smartnotes mb-2"><i class="fa-solid fa-pen-to-square"></i></div>
                        <h4 class="fw-bold">[[#{aplicacion.titulo}]]</h4>
                        <small class="text-muted">[[#{login.subtitulo}]]</small>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i> [[#{error.login}]]
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        <i class="fa-solid fa-circle-check"></i> [[#{login.cerrada}]]
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">[[#{login.username}]]</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" id="username" name="username" class="form-control"
                                       th:placeholder="#{login.ejemplo}" maxlength="30" required autofocus/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">[[#{login.password}]]</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">[[#{login.entrar}]]</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
